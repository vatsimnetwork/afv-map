<!DOCTYPE html>
<html lang="en" class="h-100">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VATSIM AFV Map</title>
    <meta name="description" content="VATSIM AFV Map" />
    <meta name="keywords" content="vatsim" />
  </head>
  <body class="h-100 bg-black">
    <div class="container-fluid d-flex h-100 flex-column">
      <img class="brand-logo" alt="VATSIM" src="/img/logo.png" />
      <div class="row flex-grow-1">
        <div class="col-md-3 mb-4 mb-md-0">
          <section class="card h-100 bg-dark">
            <div class="card-body d-flex flex-column">
              <div class="online-count" id="online-count">
                <i class="fas fa-spinner fa-pulse"></i>
              </div>
              <div class="ring-toggles">
                <label class="ring-toggle" for="toggle-pilot-ranges">
                  <input type="checkbox" id="toggle-pilot-ranges" checked />
                  <span class="ring-switch"></span>
                  <span class="ring-label">Pilots</span>
                </label>
                <label class="ring-toggle" for="toggle-atc-ranges">
                  <input type="checkbox" id="toggle-atc-ranges" checked />
                  <span class="ring-switch"></span>
                  <span class="ring-label">ATC</span>
                </label>
                <label class="ring-toggle" for="toggle-other-ranges">
                  <input type="checkbox" id="toggle-other-ranges" />
                  <span class="ring-switch"></span>
                  <span class="ring-label">Voice only</span>
                </label>
              </div>

              <div class="position-relative h-100">
                <div
                  class="position-absolute top-0 h-100 w-100 client-list"
                  id="client-list"
                ></div>
              </div>
            </div>
          </section>
        </div>
        <div class="col-md-9">
          <section class="card h-100 w-100 bg-dark">
            <div class="card-body rounded hide-other-ranges" id="map"></div>
          </section>
        </div>
      </div>
      <footer class="py-2 text-white-50">
        Copyright ©
        <script>
          document.write(new Date().getFullYear());
        </script>
        VATSIM Inc.
        <a href="https://github.com/vatsimnetwork/afv-map" target="_blank">
          Contribute on GitHub.
        </a>
      </footer>
    </div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
